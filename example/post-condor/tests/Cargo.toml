[package]
name = "tests"
version = "1.0.0"
edition = "2018"

[dependencies]
casper-types = { version = "5.0.1", default-features = false }
casper-engine-test-support = { version = "8.0.0", default-features = false }
casper-execution-engine = { version = "8.0.0", default-features = false }
casper-storage = { version = "2.0.0", default-features = false }
once_cell = "1.16.0"
casper-fixtures = { path = "../../../" }

[lib]
name = "tests"
bench = false
doctest = false

[[bin]]
name = "fixture_gen"
path = "src/fixture_gen.rs"
bench = false
doctest = false
